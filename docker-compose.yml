services:
  postgres:
    image: postgres:16
    container_name: smartloan-postgres
    environment:
      POSTGRES_USER: smartloan
      POSTGRES_PASSWORD: smartloan
      POSTGRES_DB: smartloan
    ports:
      - "5432:5432"
    volumes:
      postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartloan -d smartloan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
